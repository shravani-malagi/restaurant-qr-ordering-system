{% extends "menu/base.html" %}

{% block title %}
Payment
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card">

            <div class="card-header bg-success text-white text-center py-4">

                <h2 class="mb-0">

                    Complete Payment

                </h2>

            </div>

            <div class="card-body p-5">

                <div class="text-center mb-5">

                    <div style="
                        width:100px;
                        height:100px;
                        border-radius:50%;
                        background:#e9f7ef;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        margin:auto;
                        font-size:45px;
                    ">

                        💳

                    </div>

                </div>

                <div class="card bg-light border-0 mb-4">

                    <div class="card-body text-center">

                        <h5 class="text-muted mb-2">

                            Total Payable

                        </h5>

                        <h1 class="fw-bold text-success">

                            ₹{{ total }}

                        </h1>

                    </div>

                </div>

                <div class="alert alert-info text-center">

                    Please verify your total amount before making the payment.

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="d-grid mt-4">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            Pay Now

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
